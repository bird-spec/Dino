<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="./src/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>4d-dino</title>
  </head>
  <body>
    <div id="app"></div>
    <div
      id="boot-loader"
      style="
        position: fixed;
        inset: 0;
        z-index: 5000;
        background: #0f0f0a;
        color: #4ade80;
        display: flex;
        flex-direction: column;
        gap: 16px;
        align-items: center;
        justify-content: center;
        font-family: monospace;
      "
    >
      <div style="font-size: 28px; letter-spacing: 4px">
        Generating Timeline...
      </div>
      <div
        style="
          width: 240px;
          height: 6px;
          background: #1a2b1a;
          border-radius: 3px;
          overflow: hidden;
        "
      >
        <div
          style="
            height: 100%;
            width: 30%;
            background: #4ade80;
            border-radius: 3px;
            animation: boot-slide 1.1s ease-in-out infinite alternate;
          "
        ></div>
      </div>
    </div>
    <style>
      @keyframes boot-slide {
        from {
          margin-left: -40%;
        }
        to {
          margin-left: 100%;
        }
      }
    </style>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
